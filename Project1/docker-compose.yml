services:
  server01:
    build:
      context: ./server01
    container_name: server01
    hostname: server01
    privileged: true
    command: ["/sbin/init"]
    volumes:
      - server01_volume:/root 

    networks:
      linux-lab:
        ipv4_address: 10.10.10.11 
    ports:
      - "2221:22"
      #- "8081:8080" in order to map the application with your device to be able to open it on your localmachine + you can open it using ip of server itself.

  server02:
    build:
      context:  ./server02
    container_name:  server02
    hostname:  server02
    privileged:  true
    command: ["/sbin/init"]
    volumes:
      - server02_volume:/root 
    networks:
      linux-lab:
        ipv4_address: 10.10.10.12
    ports:
      - "2222:22"
  server03:
    build:
      context:  ./server03
    container_name:  server03
    hostname:  server03
    privileged:  true
    command: ["/sbin/init"]
    volumes:
      - server03_volume:/root 
    networks:
      linux-lab:
        ipv4_address: 10.10.10.13
    ports:
      - "2223:22"
  server04:
    build:
      context:  ./server04
    container_name:  server04
    hostname:  server04
    privileged:  true
    command: ["/sbin/init"]
    volumes:
      - server04_volume:/root 
    networks:
      linux-lab:
        ipv4_address: 10.10.10.14
    ports:
      - "2224:22"
networks:
  linux-lab:
    driver: bridge
    ipam:
      config:
        -  subnet: 10.10.10.0/24

volumes:
    server01_volume:
    server02_volume:
    server03_volume:
    server04_volume:


      
    

